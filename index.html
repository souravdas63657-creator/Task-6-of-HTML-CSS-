<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laundry Login page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <div class="img-sec">
        <img src="./107908.jpg" alt="washing machine" width="400" />
      </div>

      <div class="form-section">
        <div class="form-wrapper">

          <h1>Hello Again!</h1>
          <p class="subtitle">Welcome back! we Missed you!</p>

          <form action="">
            <div class="input-group">
              <label for="email">Email</label>
              <input
                type="email"
                name=""
                id="email"
                placeholder="emailid@site.com"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input
                type="password"
                name=""
                id="passowrd"
                placeholder="enter your password"
                required
              />
            </div>

            <div class="forgat">
              <a href="#">Forget Password</a>
            </div>

            <button type="submit" class="log-btn">Login</button>
          </form>

          <p class="register">Not a member? <a href="#">Register Now</a></p>

        </div>
      </div>
      <div class=""></div>
    </div>
  </body>
</html>
